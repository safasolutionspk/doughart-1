# DoughArt — shop + admin + API
# Requires:
#   backend/.env
#   frontend/.env.local
#   admin/.env.local
#
# Start: docker compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doughart-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - doughart
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doughart-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - doughart

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: doughart-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./admin/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - doughart

volumes:
  backend_uploads:

networks:
  doughart:
    driver: bridge
